presets:
  quality_compounder:
    metrics:
      return_on_equity_pct: { min: 15.0 }
      debt_to_equity: { max: 1.0 }
      free_cash_flow_cr: { min: 0.0 }
      revenue_cagr_5yr: { min: 10.0 }
  value_pick:
    metrics:
      earnings_per_share: { min: 1.0 } # Proxy for absolute pricing valuation limits
      debt_to_equity: { max: 2.0 }
      dividend_payout_ratio_pct: { min: 1.0 }
  growth_accelerator:
    metrics:
      revenue_cagr_5yr: { min: 15.0 }
      debt_to_equity: { max: 2.0 }
  dividend_champion:
    metrics:
      dividend_payout_ratio_pct: { min: 2.0, max: 80.0 }
      free_cash_flow_cr: { min: 0.0 }
  debt_free_blue_chip:
    metrics:
      debt_to_equity: { max: 0.0 }
      return_on_equity_pct: { min: 12.0 }
  turnaround_watch:
    metrics:
      free_cash_flow_cr: { min: 0.0 }